name: Course website
on:
  pull_request:
    paths: ["site/**", "scripts/course-tools/**", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["site/**", "scripts/course-tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Render course
        run: quarto render site
      - name: Validate public output
        run: python scripts/course-tools/validate-site.py site/_site --source site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy course
        id: deployment
        uses: actions/deploy-pages@v4
